# Minimal NestJS API on Zerops nodejs@24 — no external dependencies.
zerops:
  - setup: prod
    build:
      base: nodejs@24
      buildCommands:
        # npm ci locks to package-lock.json for reproducible builds.
        - npm ci
        - npm run build
        # Strip devDependencies after compilation — runtime needs prod deps only.
        - npm prune --omit=dev
      deployFiles:
        - ./dist
        - ./node_modules
        - ./package.json
      cache:
        - node_modules
    deploy:
      # L7 balancer waits until the new container responds before routing traffic.
      readinessCheck:
        httpGet:
          port: 3000
          path: /
    run:
      base: nodejs@24
      ports:
        - port: 3000
          httpSupport: true
      start: node dist/main
      healthCheck:
        httpGet:
          port: 3000
          path: /

  - setup: dev
    build:
      base: nodejs@24
      os: ubuntu
      buildCommands:
        # npm install (not ci) — works without a lock file in fresh dev workspaces.
        - npm install
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@24
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      # Keep container idle — developer starts NestJS watch mode via SSH.
      start: zsc noop --silent
